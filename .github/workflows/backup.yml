name: Backup diário
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar bundle de backup
        run: |
          DATE=$(date +%Y-%m-%d)
          git bundle create agenteaxon-backup-$DATE.bundle --all
          echo "Bundle criado: agenteaxon-backup-$DATE.bundle"
          ls -lh agenteaxon-backup-$DATE.bundle

      - name: Upload do backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: agenteaxon-backup-${{ github.run_number }}
          path: agenteaxon-backup-*.bundle
          retention-days: 90
