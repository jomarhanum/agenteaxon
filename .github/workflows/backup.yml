name: Backup diário
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror para backup
        env:
          TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          git remote add backup https://$TOKEN@github.com/jomarhanum/agenteaxon-backup.git
          git push backup --mirror --force
